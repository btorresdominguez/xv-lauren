<style>
/* Layout: columna estrecha tipo celular; bandas que alternan papel claro, lavanda y azul */
:root{
  --oxford:#192338; --cadet:#1e2e4f; --ylnmn:#31487a; --jordy:#8fb3e2; --lavender:#d9e1f1;
  --paper:#f6f8fc; --silver:#c3cad6; --silver-ink:#7f899c; --ink:#192338; --muted:#3a4560; --error:#a23b3b;
  --script:"Pinyon Script","Great Vibes","Brush Script MT",cursive;
  --caps:"Cinzel","Trajan Pro",Georgia,serif;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--oxford);color:var(--ink);font-family:var(--serif);font-size:20px;line-height:1.5}
[hidden]{display:none!important}
p{margin:0}
.page{width:100%;background:var(--paper);overflow:hidden}
.wrap{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px;align-items:center}
.band{padding-block:56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center}
.band.blue{background:linear-gradient(170deg,var(--ylnmn),var(--cadet));color:#fff}
.band.lav{background:var(--lavender)}
h2{font-family:var(--script);font-weight:400;font-size:clamp(46px,12vw,60px);line-height:1.1;color:var(--ylnmn);margin:0;text-wrap:balance}
.eyebrow{font-family:var(--caps);font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:var(--silver-ink)}
.band.blue .eyebrow{color:var(--jordy)}
.lead{max-width:34ch;font-size:19px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--caps);font-weight:700;
  font-size:16px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  color:#fff;background:linear-gradient(160deg,var(--ylnmn),var(--cadet));border:2px solid var(--silver);
  border-radius:999px;padding:16px 34px;box-shadow:0 8px 22px rgba(25,35,56,.3);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(25,35,56,.38)}
.btn.light{background:#fff;color:var(--cadet)}
.btn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--jordy);outline-offset:3px}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}
.sparkle{width:120px;height:18px;display:block;color:var(--silver-ink)}

.top{position:relative;padding:28px 20px 30px;text-align:center;background-size:cover;background-position:center;isolation:isolate;
  display:flex;flex-direction:column;gap:2px;align-items:center}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(246,248,252,.3),rgba(246,248,252,.92))}
.top .mis{font-family:var(--caps);font-weight:700;letter-spacing:.12em;color:var(--cadet);font-size:18px;margin-top:14px}
.top h1{font-family:var(--script);font-weight:400;font-size:clamp(72px,20vw,96px);line-height:1.1;margin:0;color:var(--cadet);text-shadow:0 2px 0 #fff,0 0 22px #fff}
.back{align-self:flex-start;font-family:var(--caps);font-size:13px;letter-spacing:.12em;color:var(--cadet);text-decoration:none;
  background:rgba(255,255,255,.85);padding:8px 14px;border-radius:999px}
.back:hover{background:#fff}
form{display:flex;flex-direction:column;gap:18px;text-align:left;width:100%;
  background:#fff;border:1px solid var(--silver);border-radius:16px;padding:clamp(18px,5vw,28px);box-shadow:0 10px 30px rgba(25,35,56,.08)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:600;color:var(--cadet);min-width:0}
label small{font-weight:400;color:var(--muted);font-size:15px}
input,select{font:inherit;font-weight:400;font-size:18px;color:var(--ink);background:var(--paper);max-width:100%;
  border:1px solid var(--jordy);border-radius:10px;padding:10px 12px;width:100%}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:18px;font-weight:600;color:var(--cadet);padding:0;margin-bottom:10px}
.choice{flex-direction:row;align-items:center;gap:10px;font-weight:400;color:var(--ink)}
.choice input{width:20px;height:20px;flex:none;accent-color:var(--ylnmn)}
.guest{border-top:1px dashed var(--silver);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.guest h3{margin:0;font-family:var(--caps);font-size:14px;letter-spacing:.16em;color:var(--ylnmn)}
#acompanantes:empty{display:none!important}
.err{color:var(--error);font-size:17px;text-align:center}
.err:empty{display:none}
form .btn{align-self:center}
.thanks{width:100%;background:#fff;border:1px solid var(--silver);border-radius:16px;padding:30px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.thanks .big{font-family:var(--script);font-size:58px;color:var(--ylnmn);line-height:1.1}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(25,35,56,.55);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .25s ease-out}
.modal-box{background:linear-gradient(var(--paper),var(--lavender));border:2px solid #fff;border-radius:18px;box-shadow:0 20px 50px rgba(25,35,56,.4);
  max-width:380px;width:100%;padding:32px 24px 26px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .3s ease-out}
.check{width:72px;height:72px;border-radius:50%;background:var(--ylnmn);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--lavender)}
.modal-box .big{font-family:var(--script);font-size:46px;color:var(--ylnmn);line-height:1.1}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.page{max-width:640px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.35)}
</style>
</head>
<body>

<main class="page">
  <header class="top">
    <a class="back" href="index.html">← Volver a la invitación</a>
    <p class="mis">MIS XV AÑOS</p>
    <h1>Lauren</h1>
  </header>

  <section class="band">
    <h2>Confirma tu asistencia</h2>
    <p>Por favor responde antes del <b>27 de noviembre</b>.</p>

    <form id="rsvp" novalidate>
      <div class="row">
        <label for="nombre">Nombre completo<input id="nombre" name="nombre" autocomplete="name" required></label>
        <label for="cedula">Cédula<input id="cedula" name="cedula" inputmode="numeric" required></label>
      </div>
      <label for="correo">Correo electrónico <small>Opcional, para enviarte la confirmación</small>
        <input id="correo" name="correo" type="email" autocomplete="email"></label>
      <fieldset>
        <legend>¿Podremos contar contigo?</legend>
        <label class="choice" for="si"><input type="radio" id="si" name="asiste" value="Sí asistiré" checked> Sí, allí estaré para celebrar contigo.</label>
        <label class="choice" for="no"><input type="radio" id="no" name="asiste" value="No asistiré"> No podré acompañarte, pero te deseo toda la felicidad.</label>
      </fieldset>
      <div id="bloque-personas" style="display:flex;flex-direction:column;gap:14px">
        <label for="personas">¿Cuántas personas asistirán con esta invitación? <small>Cuéntate a ti. Máximo 4.</small>
          <select id="personas" name="personas"><option value="1">1 persona</option><option value="2">2 personas</option><option value="3">3 personas</option><option value="4">4 personas</option></select></label>
        <div id="acompanantes" style="display:flex;flex-direction:column;gap:14px"></div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" id="enviar">Enviar confirmación</button>
    </form>

    <div class="thanks" id="gracias" hidden>
      <p class="big">¡Gracias!</p>
      <p id="gracias-txt"></p>
      <a class="btn light" href="index.html">Volver a la invitación</a>
    </div>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" hidden>
  <div class="modal-box">
    <div class="check" aria-hidden="true"><svg width="38" height="38" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <p class="big" id="modal-titulo">¡Confirmación enviada!</p>
    <p id="modal-txt"></p>
    <button class="btn" type="button" id="cerrar">Cerrar</button>
  </div>
</div>

<script>
(function(){
  var SCRIPT_URL="https://script.google.com/macros/s/AKfycbzhfWw8UMXoCao1hgxz-CGXH2BBwySotj6Zj7BqKv_7ud2pdjTzX0j1fYyVtCQm1Iirtg/exec", NOMBRE="Lauren";

  var form=document.getElementById("rsvp"), sel=document.getElementById("personas"),
      cont=document.getElementById("acompanantes"), bloque=document.getElementById("bloque-personas"),
      err=document.getElementById("err"), btn=document.getElementById("enviar"), modal=document.getElementById("modal"), timer;

  function pintarAcompanantes(){
    var n=parseInt(sel.value,10)-1, viejos={};
    cont.querySelectorAll("input").forEach(function(i){viejos[i.id]=i.value});
    cont.innerHTML="";
    for(var i=1;i<=n;i++){
      var d=document.createElement("div");d.className="guest";
      d.innerHTML='<h3>Acompañante '+i+'</h3><div class="row">'+
        '<label for="acomp_nombre_'+i+'">Nombre completo<input id="acomp_nombre_'+i+'" required></label>'+
        '<label for="acomp_cedula_'+i+'">Cédula<input id="acomp_cedula_'+i+'" inputmode="numeric" required></label></div>';
      cont.appendChild(d);
    }
    cont.querySelectorAll("input").forEach(function(i){if(viejos[i.id])i.value=viejos[i.id]});
  }
  function asiste(){return document.getElementById("si").checked}
  function actualizar(){bloque.style.display=asiste()?"flex":"none"}
  sel.addEventListener("change",pintarAcompanantes);
  document.getElementById("si").addEventListener("change",actualizar);
  document.getElementById("no").addEventListener("change",actualizar);
  pintarAcompanantes();actualizar();

  function mostrarGracias(txt){
    form.hidden=true;document.getElementById("gracias-txt").textContent=txt;document.getElementById("gracias").hidden=false;
  }
  function abrirModal(txt){
    document.getElementById("modal-txt").textContent=txt;modal.hidden=false;document.getElementById("cerrar").focus();
    timer=setTimeout(cerrarModal,6000);
  }
  function cerrarModal(){clearTimeout(timer);modal.hidden=true}
  document.getElementById("cerrar").addEventListener("click",cerrarModal);
  modal.addEventListener("click",function(e){if(e.target===modal)cerrarModal()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!modal.hidden)cerrarModal()});

  try{var previo=localStorage.getItem("xv_confirmado");if(previo)mostrarGracias(previo)}catch(x){}

  form.addEventListener("submit",function(e){
    e.preventDefault();err.textContent="";
    var nombre=form.nombre.value.trim(), cedula=form.cedula.value.trim(), correo=form.correo.value.trim();
    if(!nombre||!cedula){err.textContent="Escribe tu nombre completo y tu cédula.";return}
    if(correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){err.textContent="Revisa el correo electrónico, parece incompleto.";return}
    var lista=[];
    if(asiste()){
      var n=parseInt(sel.value,10)-1;
      for(var i=1;i<=n;i++){
        var an=document.getElementById("acomp_nombre_"+i).value.trim(), ac=document.getElementById("acomp_cedula_"+i).value.trim();
        if(!an||!ac){err.textContent="Completa el nombre y la cédula del acompañante "+i+".";return}
        lista.push(an+" (C.C. "+ac+")");
      }
    }
    if(!SCRIPT_URL){err.textContent="El formulario aún no está conectado. Avísale a la familia de "+NOMBRE+".";return}
    var datos=new URLSearchParams();
    datos.append("nombre",nombre);datos.append("cedula",cedula);datos.append("correo",correo);
    datos.append("asiste",asiste()?"Sí asistiré":"No asistiré");
    datos.append("personas",asiste()?sel.value:"0");
    datos.append("acompanantes",lista.join("\n"));
    btn.disabled=true;btn.textContent="Enviando…";
    fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:datos})
      .then(function(){
        var txt=asiste()?"Tu asistencia quedó registrada. ¡Nos vemos en la fiesta!":"Gracias por avisarnos. Te vamos a extrañar.";
        mostrarGracias(txt);
        try{localStorage.setItem("xv_confirmado",txt)}catch(x){}
        abrirModal(txt);
      })
      .catch(function(){
        err.textContent="No se pudo enviar. Revisa tu conexión a internet e inténtalo de nuevo.";
        btn.disabled=false;btn.textContent="Enviar confirmación";
      });
  });
})();
</script>
